services:
  # -----------------------------------------------------------
  # BACKEND: Web Service (Go)
  # -----------------------------------------------------------
  - type: web
    name: medividrios-api
    env: go
    region: ohio
    plan: free
    buildCommand: go build -o bin/api backend/cmd/server/main.go
    startCommand: ./bin/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medividrios-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: SMTP_PORT
        value: 587
      # SMTP_HOST, SMTP_USER, SMTP_PASS deben configurarse en el dashboard por seguridad

  # -----------------------------------------------------------
  # FRONTEND: Static Site (React/Vite)
  # -----------------------------------------------------------
  - type: static
    name: medividrios-frontend
    region: ohio
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromStack:
          type: web
          name: medividrios-api
          property: url

# -----------------------------------------------------------
# INFRAESTRUCTURA: Base de Datos PostgreSQL
# -----------------------------------------------------------
databases:
  - name: medividrios-db
    plan: free
    databaseName: medividrios
    user: admin
    region: ohio